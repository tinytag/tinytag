name: Fuzz
on: [workflow_dispatch]
permissions: {}

jobs:
  fuzz:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install atheris

      - name: Run fuzzer
        run: |
          set -o pipefail
          mkdir -p fuzz/artifacts
          python -m fuzz.fuzz_tinytag tinytag/tests/samples \
            -atheris_runs=5000000 -timeout=1 -rss_limit_mb=80 -artifact_prefix=fuzz/artifacts/ \
            2>&1 | tee fuzz/fuzz.log

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz
          path: |
            fuzz/artifacts/
            tinytag/tests/samples/
            fuzz/fuzz.log
